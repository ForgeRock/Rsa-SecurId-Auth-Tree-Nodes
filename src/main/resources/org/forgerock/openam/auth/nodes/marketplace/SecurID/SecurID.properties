nodeDescription=RSA SecurID
nodeHelp=The RSA SecurID authentication nodes let administrators integrate RSA SecurID Cloud Authentication Service MFA into a ForgeRock Journey
baseURL=Base URL
baseURL.help=Your RSA SecurID MFA API URL.  For the Cloud Authentication Service, https://example.auth.securid.com:443/mfa/v1_1.  For an Authentication Manager, https://am.example.com:5555/mfa/v1_1 - Next Tokencode challenges are only issued by an Authentication Manager, never by a Cloud-only tenant
clientID=Client ID
clientID.help=A string identifying this instance of the RSA SecurID node.  This value will be displayed in end-user push notification messages and in the Application field in the RSA SecurID User Event Monitor.  For example: ForgeRock Login Journey
assurancePolicy=Assurance Policy ID
assurancePolicy.help=The name of the RSA SecurID Policy to be used by this node.  For example:  All Users Low Assurance Level
clientKey=Client Key
clientKey.help=The unique keys for communication between ForgeRock and the RSA SecurID Cloud Authentication Service
verifySSL=Verify SSL
verifySSL.help=If enabled, validates certificate chains
thePrompt=Prompt for MFA Choice
thePrompt.help=The text displayed to your end users, to tell them to select an MFA option
theWaitingForResponseMessage=Waiting Message
theWaitingForResponseMessage.help=The message to display while waiting for the response from the end user
theNextTokencodePrompt=Next Tokencode Prompt
theNextTokencodePrompt.help=The text displayed when RSA asks for a second, consecutive tokencode to resynchronise the user’s token.  RSA identifies this method only as SECURID_NEXT_TOKENCODE, which is not usable as an end-user label

 
